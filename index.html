/* ============================== 3. YT SDK WRAPPER ============================== */
const YT = (() => {
  const g = window.ytgame;
  const inYT = !!(g && g.IN_PLAYABLES_ENV);
  const safe = (f, d) => { try { return f(); } catch (e) { return d; } };
  const quiet = p => { if (p && p.catch) p.catch(() => {}); };
  return {
    inYT,
    firstFrame() { if (inYT) safe(() => g.game.firstFrameReady()); },
    ready()      { if (inYT) safe(() => g.game.gameReady()); },
    async load() {
      if (inYT) { try { const s = await g.game.loadData(); if (s) return s; } catch (e) {} }
      if (inYT) return '';
      return safe(() => localStorage.getItem('shakhta_save') || '', ''); // только вне YouTube, для тестов
    },
    save(s) {
      // В Playables прогресс сохраняется только через saveData (требование сертификации)
      if (inYT) safe(() => quiet(g.game.saveData(s)));
      else safe(() => localStorage.setItem('shakhta_save', s));
    },
    score(v)      { if (inYT) safe(() => quiet(g.engagement.sendScore({ value: Math.floor(v) }))); },
    onPause(f)    { if (inYT) safe(() => g.system.onPause(f)); },
    onResume(f)   { if (inYT) safe(() => g.system.onResume(f)); },
    audioOn()     { return inYT ? safe(() => g.system.isAudioEnabled(), true) : true; },
    onAudio(f)    { if (inYT) safe(() => g.system.onAudioEnabledChange(f)); },
    // Реклама только через YouTube SDK: сторонняя реклама и покупки в Playables запрещены.
    // Вне YouTube показываем тестовую заглушку, чтобы можно было проверить все сценарии.
    rewarded(id) {
      if (inYT) {
        try { return Promise.resolve(g.ads.requestRewardedAd(id)).then(r => !!r).catch(() => false); }
        catch (e) { return Promise.resolve(false); }
      }
      return new Promise(res => setTimeout(() => res(true), 1500));
    },
    interstitial() {
      if (inYT) {
        try { return Promise.resolve(g.ads.requestInterstitialAd()).catch(() => {}); }
        catch (e) { return Promise.resolve(); }
      }
      return new Promise(res => setTimeout(res, 800));
    },
    lang() {
      if (inYT) { const p = safe(() => g.system.getLanguage(), null); if (p) return Promise.resolve(p); }
      // navigator.language в Playables запрещён; вне YouTube язык задаётся ?lang=en, по умолчанию русский
      return Promise.resolve(new URLSearchParams(location.search).get('lang') || 'ru');
    },
  };
})();

/* ============================== 5. RNG ============================== */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rng = mulberry32(1);
const rr = (a, b) => a + rng() * (b - a);
const fr = (a, b) => a + Math.random() * (b - a); // для эффектов: не трогает сид уровня

/* ============================== 6. AUDIO ============================== */
const AU = {
  ctx: null, master: null, noiseBuf: null, muted: false, ytOn: true, beatT: 0, beatN: 0,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.connect(this.ctx.destination);
      const len = this.ctx.sampleRate * 0.5;
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.apply();
    } catch (e) { this.ctx = null; }
  },
  // Общий звук подчиняется только настройке YouTube; кнопка в игре выключает лишь музыку (общий mute в игре не рекомендуется)
  on() { return this.ctx && this.ytOn; },
  apply() { if (this.master) this.master.gain.value = this.ytOn ? 0.4 : 0; },
  suspend() { if (this.ctx && this.ctx.state === 'running') this.ctx.suspend().catch(() => {}); },
  resume()  { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); },
  tone(f1, f2, dur, type, vol) {
    if (!this.on()) return;
    const c = this.ctx, t = c.currentTime, o = c.createOscillator(), g = c.createGain();

const wallX = side => side < 0 ? PLX : PRX;

// Монеты по идеальной траектории прыжка: подсказка ритма
function coinArc(fromSide, leaveY, rise) {
  const fx = wallX(fromSide), tx = wallX(-fromSide);
  for (const f of [0.25, 0.55, 0.85]) {
    const e = 1 - (1 - f) * (1 - f);
    addCoin(fx + (tx - fx) * e + CFG.size / 2, leaveY + CFG.size / 2 + rise * f);

const letterP = () => 1 + tl('letters') * 0.1 + (hasPet('bee') ? 0.5 : 0);
// Буква ШАХТА вместо монеты (rng вызывается всегда, чтобы сид Забега дня не зависел от питомцев)
function maybeLetter(o, p) {

// Цепочка шипов. switchP=1 — строгий зигзаг, меньше — «лесенка». withSaw — пила в каждом переходе.
function genChain(n, switchP, withSaw) {
  const d = diffAt(genY);
  let side = rng() < 0.5 ? -1 : 1;
  for (let i = 0; i < n; i++) {
    const h = rr(60, 90 + d * 22);
    addSpike(side, genY, h);
    const top = genY + h;
    let gap = gapFor(d) + (withSaw ? 80 : 0);
    const nextSide = (i === n - 1) ? side : (rng() < switchP ? -side : side);
    const sp = speedAt(top), rise = sp * CFG.jumpTime;
    if (i < n - 1 && nextSide !== side) {
      // игрок вынужден быть на стене -side, следующий шип там же: перелёт на side
      const nextY = top + gap;
      const leave = ((top - rise - 3) + (nextY - 19)) / 2;
      coinArc(-side, leave, rise);
      if (withSaw) addSaw(top + gap * 0.5 + rise * 0.3, d);
    } else if (i < n - 1) {
      for (let y = top + 25; y < top + gap - 10; y += 40) addCoin(wallX(-side) + CFG.size / 2, y + CFG.size / 2);
    }

function realUpdate(dt) {

  if (state === 'PLAY') AU.music(dt, speed);
  if (state === 'DYING') { dieT -= dt; if (dieT <= 0) afterDeath(); }
  if (state === 'REVIVE' && !adBusy) { reviveLock -= dt; reviveT -= dt; if (reviveT <= 0) gameOver(); }
  if (banner) { banner.life -= dt; if (banner.life <= 0) banner = null; }

  if (hudPulse > 0) hudPulse -= dt;

    let tx = P.x + 11 + (P.st === 'wall' ? -P.side * (run ? 30 : 44) : 0), ty = P.y + (run ? 46 : 4) + Math.sin(menuT * 3) * 5;
    for (let i = 0; i < save.petOn.length && i < 3; i++) {
      const pp = petPs[i], k = Math.min(1, dt * (7 - i * 1.5));
      pp.x += (tx - pp.x) * k; pp.y += (ty - pp.y) * k;
      if (Math.abs(ty - pp.y) > 300) { pp.x = tx; pp.y = ty; }
      tx = pp.x + (P.side < 0 ? 22 : -22); ty = pp.y + (run ? 16 : 0);
    }
  }
  if (!toast && toastQ.length) toast = toastQ.shift();
  if (toast) { toast.life -= dt; if (toast.life <= 0) toast = null; }
  if (transT > 0) transT -= dt;
  if (state === 'OVER') overT += dt;

  txt(toast.t, W / 2, y + 21, 15, '#fff', 'center', 800, Math.min(1, toast.life * 3));
  ctx.globalAlpha = UIA;
}

function render(t) {
  const th = theme(heightM);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = rgb(mix(th.bg, [0, 0, 0], 0.4)); ctx.fillRect(0, 0, cv.width, cv.height);
  const s = dpr * scale;
  let shx = 0, shy = 0;
  if (shakeT > 0) { const m = Math.min(3, shakeT * 14); /* слабая тряска: меньше нагрузки на глаза */ shx = (Math.random() - 0.5) * m; shy = (Math.random() - 0.5) * m; }
  ctx.setTransform(s, 0, 0, s, dpr * offX + shx * s, dpr * offY + shy * s);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, VH); ctx.clip();
  drawWorld(th);
  if (feverT > 0 && state === 'PLAY') { ctx.fillStyle = 'rgba(255,210,63,0.06)'; ctx.fillRect(0, 0, W, VH); }
  drawObjects(t); drawGhost(t); drawPlayer(t);
  if (!['DYING', 'OVER', 'REVIVE'].includes(state)) save.petOn.forEach((k, i) => { if (i < 3) drawPet(petPs[i].x, sy(petPs[i].y), k, t + i); });
  drawFX();
  if (darkK > 0 && P) { // тёмный участок: светлый круг вокруг игрока
    const px = P.x + 11, py = sy(P.y) - 11;
    const gr = ctx.createRadialGradient(px, py - 40, 90, px, py - 40, 240);
    gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, `rgba(0,0,0,${0.9 * darkK})`);
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, VH);
  }
  if (flashT > 0) { ctx.fillStyle = `rgba(255,255,255,${flashT * 0.15})`; ctx.fillRect(0, 0, W, VH); }
  ctx.restore();
  ctx.setTransform(s, 0, 0, s, dpr * offX, dpr * offY);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, VH); ctx.clip();
  if (state !== prevState) { if (!['PLAY', 'COUNT', 'DYING'].includes(state)) transT = 0.22; prevState = state; }
  UIA = 1;
  if (state === 'PLAY' || state === 'COUNT' || state === 'DYING') drawHUD(t, th);
  // плавное появление экранов: прозрачность и небольшой сдвиг
  const k = transT > 0 ? 1 - transT / 0.22 : 1;
  UIA = k; ctx.globalAlpha = k; ctx.translate(0, (1 - k) * 14);
  if (state === 'MENU' || state === 'BOOT' || state === 'GIFT' || state === 'TUTOR') drawMenu(t, th);
  if (state === 'GIFT') drawGift(t, th);
  if (state === 'TUTOR') drawTutor(t, th);
  if (state === 'SHOP') drawShop(t, th);
  if (state === 'ACH') drawAch(t, th);
  if (state === 'CHEST') drawChestScreen(t, th);
  if (state === 'PAUSE') { drawHUD(t, th); drawPause(th); }
  if (state === 'COUNT') txt(String(Math.ceil(countT / 0.3)), W / 2, VH * 0.4, 72, '#fff', 'center', 900);
  if (state === 'REVIVE') drawRevive(t, th);
  if (state === 'OVER') drawOver(t, th);
  ctx.setTransform(s, 0, 0, s, dpr * offX, dpr * offY); UIA = 1; ctx.globalAlpha = 1;
  if (adBusy) drawAd();
  drawToast();
  ctx.restore();
}

/* ============================== 15. INPUT ============================== */
function toLogic(e) { return { x: (e.clientX - offX) / scale, y: (e.clientY - offY) / scale }; }
function toggleSound() { save.muted = !save.muted; AU.muted = save.muted; AU.init(); persist(); }
function toggleVib() { save.vibOff = !save.vibOff; persist(); vib(20); }
function pause() { if (state === 'PLAY' || state === 'COUNT') { state = 'PAUSE'; AU.suspend(); } }
function resumeFromPause() { AU.init(); AU.resume(); state = 'COUNT'; countT = 0.9; }
function toMenu() { reset(); state = 'MENU'; }

function buySkin(i) {
  if (save.owned.includes(i)) { save.skin = i; persist(); AU.init(); AU.land(); return; }
  const price = SKINS[i].price;
  if (price < 0) { const a = ACH.find(a => a.id === SKINS[i].ach); showToast('🏆 ' + achName(a)); return; }
  if (save.coins < price) { showToast(L.noMoney); return; }
  save.coins -= price; save.owned.push(i); save.skin = i; persist();
  AU.init(); AU.power(); showToast(L.bought);
}
function buyBoost(key, price) {
  if (save.coins < price) { showToast(L.noMoney); return; }
  save.coins -= price; save[key]++; persist(); AU.init(); AU.coin(3); showToast(L.bought);
}
function freeCoins() {
  if (Date.now() < save.freeAt) return;
  watchAd('free_coins', () => {
    save.coins += CFG.freeCoins; save.freeAt = Date.now() + CFG.freeCooldown; persist();
    AU.power(); showToast(L.got + ': +' + CFG.freeCoins);
  });
}

function press(p, fromKey) {
  if (state === 'BOOT' || adBusy) return;
  if (state === 'MENU') {
    if (!fromKey && inR(p, BTN.sound())) { toggleSound(); return; }
    if (!fromKey && inR(p, BTN.vibB())) { toggleVib(); return; }
    if (!fromKey && inR(p, BTN.shop())) { state = 'SHOP'; return; }
    if (!fromKey && inR(p, BTN.daily())) { startRun(true); return; }
    if (!fromKey && inR(p, BTN.ghostB())) { if (save.ghost) startRun(false, true); else showToast(L.ghostNone); return; }
    if (!fromKey && inR(p, BTN.ach())) { state = 'ACH'; return; }
    if (!fromKey && inR(p, BTN.help())) { state = 'TUTOR'; return; }
    if (!fromKey && inR(p, BTN.chestB())) { if (save.keys >= 3) openChest(); return; }
    startRun(false); return;
  }
  if (state === 'TUTOR') {
    if (fromKey || inR(p, BTN.tGo())) {
      save.tutSeen = true; persist(); AU.init();
      state = checkDaily() ? 'GIFT' : 'MENU';
    }
    return;
  }
  if (state === 'ACH') { if (fromKey || inR(p, BTN.sBack())) state = 'MENU'; return; }
  if (state === 'CHEST') {
    if (!chest.opened) { chestReveal(); return; }
    if (chest.t <= 1.1) return;
    if (!fromKey && !chest.x2 && chest.rew[0].kind !== 'trail' && inR(p, BTN.cX2())) {
      watchAd('chest_x2', () => { chest.x2 = true; giveRew(chest.rew[0]); persist(); AU.power(); });
      return;
    }
    if (fromKey || inR(p, BTN.cTake())) { if (save.keys >= 3) openChest(); else { chest = null; state = 'MENU'; } }
    return;
  }
  if (state === 'GIFT') {
    if (fromKey || inR(p, BTN.gTake())) claimGift(1);
    else if (inR(p, BTN.gX2())) watchAd('daily_x2', () => claimGift(2));
    return;
  }
  if (state === 'SHOP') {
    if (fromKey) return;
    if (inR(p, BTN.sBack())) { state = 'MENU'; return; }
    if (inR(p, BTN.sFree())) { freeCoins(); return; }
    for (let i = 0; i < TABS.length; i++) if (inR(p, BTN.tab(i))) { shopTab = TABS[i]; return; }
    if (shopTab === 'skins') { for (let i = 0; i < SKINS.length; i++) if (inR(p, BTN.sCell(i))) { buySkin(i); return; } return; }
    if (shopTab === 'trail') { for (let i = 0; i < TRAILS.length; i++) if (inR(p, BTN.sCell(i))) { buyTrail(i); return; } return; }
    if (shopTab === 'pet') { for (let i = 0; i < PETS.length; i++) if (inR(p, BTN.pRow(i))) { buyPet(PETS[i]); return; } return; }
    if (shopTab === 'tal') {
      if (inR(p, BTN.tReset())) { resetTal(); return; }
      for (let i = 0; i < TALS.length; i++) if (inR(p, BTN.tRow(i))) { buyTal(TALS[i]); return; }
      return;
    }
    if (shopTab === 'up') { for (let i = 0; i < UPS.length; i++) if (inR(p, BTN.uRow(i))) { buyUp(UPS[i]); return; } return; }
    const SI = SHOPI(); for (let i = 0; i < SI.length; i++) if (inR(p, BTN.iRow(i))) { buyItem(SI[i]); return; }
    return;
  }
  if (state === 'PLAY') {
    if (!fromKey && inR(p, BTN.pause())) { pause(); return; }
    if (!fromKey) for (let i = 0; i < ITEMS.length; i++) if ((save.items[ITEMS[i].k] > 0 || itemUse[ITEMS[i].k] > 0) && inR(p, BTN.item(i))) { useItem(ITEMS[i].k); return; }
    tapGame(); return;
  }
  if (state === 'PAUSE') {
    if (!fromKey && inR(p, BTN.sound())) { toggleSound(); return; }
    if (!fromKey && inR(p, BTN.vibB())) { toggleVib(); return; }
    if (!fromKey && inR(p, BTN.pExit())) { AU.init(); AU.resume(); revived = true; gameOver(); return; } // выйти из забега: монеты и опыт сохраняются
    resumeFromPause(); return;
  }
  if (state === 'REVIVE') {
    if (fromKey || reviveLock > 0) return; // клавишу не считаем ответом: игрок мог жать пробел в момент смерти
    if (inR(p, BTN.revAd())) watchAd('revive', revive);
    else if (inR(p, BTN.revCoin())) reviveForCoins();
    else if (inR(p, BTN.revNo())) gameOver();
    return;
  }
  if (state === 'OVER') {
    if (overT <= 0.45) return;
    if (fromKey || inR(p, BTN.again())) restartWithAd();
    else if (coinsRun > 0 && !x2used && inR(p, BTN.x2())) watchAd('double_coins', () => {
      x2used = true; save.coins += coinsRun; persist(); AU.power(); showToast(L.got + ': +' + coinsRun);
    });
    else if (inR(p, BTN.toMenu())) toMenu();
  }
}
cv.addEventListener('pointerdown', e => { e.preventDefault(); press(toLogic(e), false); }, { passive: false });
['touchstart', 'touchmove', 'touchend', 'gesturestart', 'contextmenu', 'dblclick'].forEach(ev =>
  document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  const k = e.code;
  if (k === 'Space' || k === 'ArrowUp' || k === 'Enter' || k === 'KeyW' || k === 'ArrowLeft' || k === 'ArrowRight') { e.preventDefault(); press({ x: -1, y: -1 }, true); }
  else if (k === 'KeyP' || k === 'Escape') {
    if (adBusy) return;
    if (state === 'PLAY' || state === 'COUNT') pause();
    else if (state === 'PAUSE') resumeFromPause();
    else if (state === 'SHOP' || state === 'ACH') state = 'MENU';
    else if (state === 'CHEST') { chest = null; state = 'MENU'; } // награда уже начислена при открытии
    else if (state === 'TUTOR' || state === 'GIFT') press({ x: -1, y: -1 }, true); // Esc закрывает окно
    else if (state === 'REVIVE' && reviveLock <= 0) gameOver();
  }
  else if (k === 'KeyM') toggleSound();
  else if (state === 'PLAY' && !adBusy) { const ix = ['Digit1', 'Digit2', 'Digit3'].indexOf(k) >= 0 ? ['Digit1', 'Digit2', 'Digit3'].indexOf(k) : ['KeyZ', 'KeyX', 'KeyC'].indexOf(k); if (ix >= 0) useItem(ITEMS[ix].k); }
});
// В Playables пауза только по onPause/onResume (Page Visibility API запрещён); вне YouTube — по сворачиванию вкладки
if (!YT.inYT) {
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  window.addEventListener('blur', pause);
}
YT.onPause(() => { pause(); AU.suspend(); persist(); });
YT.onResume(() => { /* остаёмся на экране паузы до тапа игрока */ });
YT.onAudio(on => { AU.ytOn = !!on; AU.apply(); });

/* ============================== 16. LOOP ============================== */
let last = performance.now(), acc = 0, firstFrame = false;
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  realUpdate(dt);
  // Равные подшаги на каждый кадр: на экранах 90/120 Гц нет дёрганья от чередования 1 и 2 шагов
  const n = Math.max(1, Math.ceil(dt / STEP)), sub = dt / n;
  for (let i = 0; i < n; i++) update(sub);
  render(now / 1000);
  if (!firstFrame) { firstFrame = true; YT.firstFrame(); }
  requestAnimationFrame(frame);
}

/* ============================== 17. BOOT ============================== */
resize(); reset();
requestAnimationFrame(t => { last = t; frame(t); });
Promise.all([
  YT.load().then(s => { try { if (s) Object.assign(save, JSON.parse(s)); } catch (e) {} }),
  YT.lang().then(l => { L = String(l).toLowerCase().startsWith('ru') ? STR.ru : STR.en; document.title = L.title; }).catch(() => {}),
]).finally(() => {
  if (!Array.isArray(save.owned) || !save.owned.includes(0)) save.owned = [0].concat(Array.isArray(save.owned) ? save.owned : []);
  if (!save.owned.includes(save.skin)) save.skin = 0;
  AU.muted = !!save.muted; AU.ytOn = YT.audioOn();
  if (!Array.isArray(save.missions)) save.missions = [];
  save.up = Object.assign({ magnet: 0, shield: 0, luck: 0, coin: 0, armor: 0, combo: 0, revive: 0, head: 0, pocket: 0, slot: 0 }, save.up);
  save.stats = Object.assign({ coins: 0, near: 0 }, save.stats);
  if (!Array.isArray(save.ach)) save.ach = [];
  if (!save.tal || typeof save.tal !== 'object') save.tal = {};
  if (!Array.isArray(save.pets)) save.pets = [];
  if (!save.pets.includes(save.pet)) save.pet = '';
  if (!Array.isArray(save.petOn)) save.petOn = save.pet ? [save.pet] : [];
  save.petOn = save.petOn.filter(k => save.pets.includes(k)).slice(0, petSlots());
  if (!Array.isArray(save.trails) || !save.trails.includes(0)) save.trails = [0].concat(Array.isArray(save.trails) ? save.trails : []);
  if (!save.trails.includes(save.trail)) save.trail = 0;
  save.items = Object.assign({ bomb: 0, slow: 0, dash: 0 }, save.items);
  if (talFree() < 0) save.tal = {}; // таланты подорожали: старые вложения возвращаем
  refillMissions();
  reset(); state = !save.tutSeen ? 'TUTOR' : checkDaily() ? 'GIFT' : 'MENU';
  AU.init(); // звук готовим сразу, не дожидаясь тапа (частая причина отказа в сертификации)
  YT.ready(); checkAch();
});

// для автотестов и отладки
window.__game = { get state() { return state; }, get score() { return score; }, get height() { return heightM; }, get P() { return P; }, get objs() { return objs; }, tap: () => press({ x: W / 2, y: VH / 2 }, true), click: (x, y) => press({ x, y }, false), BTN, save, get daily() { return dailyMode; }, warp(y) { P.y = camY = y; genY = y + 420; objs = []; ensureGen(); }, get VH() { return VH; }, get chest() { return chest; }, startRun, get ghostMode() { return ghostMode; }, get speed() { return speed; }, get darkK() { return darkK; }, useItem, get letters() { return lettersGot; } };
})();
